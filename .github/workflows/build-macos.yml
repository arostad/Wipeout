name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Apple Silicon app
        run: ./build.sh

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Wipeout.app Wipeout.app.zip

      - name: Create update metadata
        run: |
          VERSION=$(awk -F'"' '/^VERSION="/ { print $2; exit }' build.sh)
          test -n "$VERSION"
          printf '%s' "$VERSION" > version.txt
          HASH=$(shasum -a 256 Wipeout.app.zip | awk '{ print tolower($1) }')
          printf '%s  Wipeout.app.zip' "$HASH" > Wipeout.app.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Wipeout-macOS-arm64
          path: |
            Wipeout.app.zip
            Wipeout.app.zip.sha256
            version.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Wipeout-macOS-arm64

      - name: Publish latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: Apple Silicon build of Wipeout. This file is replaced on every push to main.
          files: |
            Wipeout.app.zip
            Wipeout.app.zip.sha256
            version.txt
          make_latest: true
