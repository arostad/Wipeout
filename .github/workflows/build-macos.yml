name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Apple Silicon app
        run: ./build.sh

      - name: Zip app bundle
        run: |
          set -euo pipefail
          test -d build/wipeout.app
          # Unique working names: macos-latest is case-insensitive APFS, so
          # wipeout.app.zip and Wipeout.app.zip cannot both exist on this runner.
          # The release job (Linux) renames them to the published names.
          ditto -c -k --sequesterRsrc --keepParent build/wipeout.app current-wipeout.app.zip

          # Legacy zip for 0.4.15 and older updaters: they require a top-level
          # entry literally named Wipeout.app. Case-rename the bundle via a
          # temporary name, zip, then rename back.
          staging="build/.legacy-bundle-rename-$$"
          mv build/wipeout.app "$staging"
          mv "$staging" build/Wipeout.app
          ditto -c -k --sequesterRsrc --keepParent build/Wipeout.app legacy-Wipeout.app.zip
          mv build/Wipeout.app "$staging"
          mv "$staging" build/wipeout.app

      - name: Create update metadata
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^VERSION="/ { print $2; exit }' build.sh)
          test -n "$VERSION"
          printf '%s' "$VERSION" > version.txt
          # Sidecars use the published filenames, which old and new updaters expect.
          HASH=$(shasum -a 256 current-wipeout.app.zip | awk '{ print tolower($1) }')
          printf '%s  wipeout.app.zip' "$HASH" > current-wipeout.app.zip.sha256
          LEGACY_HASH=$(shasum -a 256 legacy-Wipeout.app.zip | awk '{ print tolower($1) }')
          printf '%s  Wipeout.app.zip' "$LEGACY_HASH" > legacy-Wipeout.app.zip.sha256

      - name: Verify update zip contract
        run: |
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          from pathlib import Path

          def check(zip_path, top, executable):
              zf = zipfile.ZipFile(zip_path)
              names = zf.namelist()
              tops = {n.split("/")[0] for n in names}
              assert tops == {top}, f"{zip_path}: top-level {tops}, expected {{{top}}}"
              exe = f"{top}/Contents/MacOS/{executable}"
              plist_name = f"{top}/Contents/Info.plist"
              assert exe in names, f"{zip_path}: missing {exe}"
              assert plist_name in names, f"{zip_path}: missing Info.plist"
              plist = plistlib.loads(zf.read(plist_name))
              assert plist.get("CFBundleExecutable") == executable, plist.get("CFBundleExecutable")
              assert plist.get("CFBundleShortVersionString") == Path("version.txt").read_text()
              print(f"ok {zip_path}: top={top} exe={executable} entries={len(names)}")

          check("current-wipeout.app.zip", "wipeout.app", "wipeout")
          check("legacy-Wipeout.app.zip", "Wipeout.app", "wipeout")

          pairs = (
              ("current-wipeout.app.zip", "current-wipeout.app.zip.sha256", "wipeout.app.zip"),
              ("legacy-Wipeout.app.zip", "legacy-Wipeout.app.zip.sha256", "Wipeout.app.zip"),
          )
          for zip_name, sidecar_name, published_name in pairs:
              actual = hashlib.sha256(Path(zip_name).read_bytes()).hexdigest()
              sidecar = Path(sidecar_name).read_text().strip().split()
              assert sidecar[0].lower() == actual, (sidecar_name, sidecar[0], actual)
              assert sidecar[-1] == published_name, sidecar
              print(f"ok {sidecar_name} matches and names {published_name}")

          h1 = hashlib.sha256(Path("current-wipeout.app.zip").read_bytes()).hexdigest()
          h2 = hashlib.sha256(Path("legacy-Wipeout.app.zip").read_bytes()).hexdigest()
          assert h1 != h2, "expected the legacy zip to hash differently"
          print("ok zip hashes differ")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wipeout-macOS-arm64
          path: |
            current-wipeout.app.zip
            current-wipeout.app.zip.sha256
            legacy-Wipeout.app.zip
            legacy-Wipeout.app.zip.sha256
            version.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wipeout-macOS-arm64

      # GitHub Release asset names and /releases/download/latest/ URLs are
      # case-insensitive, so wipeout.app.zip and Wipeout.app.zip cannot both
      # exist as distinct assets (0.4.16's dual upload failed and broke
      # checksums). Publish only the legacy-compatible pair. GitHub serves
      # those same bytes under the lowercase names, so 0.4.16+ updaters
      # (lowercase URL, accept either bundle name, [Ww]ipeout sidecar) and
      # older updaters (Wipeout.app.zip, top-level Wipeout.app, sidecar
      # naming Wipeout.app.zip) both keep working.
      - name: Stage the published zip pair
        run: |
          set -euo pipefail
          mv legacy-Wipeout.app.zip Wipeout.app.zip
          mv legacy-Wipeout.app.zip.sha256 Wipeout.app.zip.sha256
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          from pathlib import Path
          zpath = Path("Wipeout.app.zip")
          sidecar = Path("Wipeout.app.zip.sha256")
          zf = zipfile.ZipFile(zpath)
          tops = {n.split("/")[0] for n in zf.namelist()}
          assert tops == {"Wipeout.app"}, tops
          assert "Wipeout.app/Contents/MacOS/wipeout" in zf.namelist()
          plist = plistlib.loads(zf.read("Wipeout.app/Contents/Info.plist"))
          assert plist.get("CFBundleExecutable") == "wipeout"
          assert plist.get("CFBundleShortVersionString") == Path("version.txt").read_text()
          actual = hashlib.sha256(zpath.read_bytes()).hexdigest()
          parts = sidecar.read_text().strip().split()
          assert parts[0].lower() == actual, (parts[0], actual)
          assert parts[-1] == "Wipeout.app.zip", parts
          print(f"ok publish pair: top=Wipeout.app size={zpath.stat().st_size} sha256={actual}")
          PY
          # Keep the current-named zip out of the upload set.
          rm -f current-wipeout.app.zip current-wipeout.app.zip.sha256
          ls -l Wipeout.app.zip Wipeout.app.zip.sha256 version.txt

      - name: Remove colliding latest assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: delete any existing asset whose name case-insensitively
          # matches a file we are about to upload. A leftover
          # wipeout.app.zip.sha256 would 422 a Wipeout.app.zip.sha256 upload.
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" >/tmp/latest-release.json 2>/tmp/latest-release.err; then
            echo "No latest release yet (or lookup failed); upload will create it."
            cat /tmp/latest-release.err || true
            exit 0
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          data = json.loads(open("/tmp/latest-release.json").read())
          wanted = {"wipeout.app.zip", "wipeout.app.zip.sha256", "version.txt"}
          for asset in data.get("assets") or []:
              name = asset.get("name") or ""
              if name.lower() not in wanted:
                  continue
              aid = asset["id"]
              print(f"deleting existing asset {name} (id {aid})")
              r = subprocess.run(
                  ["gh", "api", "--method", "DELETE",
                   f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{aid}"],
                  check=False,
              )
              if r.returncode != 0:
                  sys.exit(f"failed to delete asset {name} ({aid})")
          PY

      - name: Publish latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: Apple Silicon build of wipeout. This file is replaced on every push to main. The published archive is Wipeout.app.zip (top-level Wipeout.app) so 0.4.15 and older in-app updaters keep working. GitHub serves the same file at wipeout.app.zip, which 0.4.16 and later updaters request.
          files: |
            Wipeout.app.zip
            Wipeout.app.zip.sha256
            version.txt
          overwrite_files: true
          make_latest: true
