name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Apple Silicon app
        run: ./build.sh

      - name: Zip app bundle
        run: |
          set -euo pipefail
          test -d build/wipeout.app
          ditto -c -k --sequesterRsrc --keepParent build/wipeout.app wipeout.app.zip

          # Legacy zip for 0.4.15 and older updaters: they require a top-level
          # entry literally named Wipeout.app. macos-latest is case-insensitive
          # APFS, so case-rename via a temporary name, zip, then rename back.
          staging="build/.legacy-bundle-rename-$$"
          mv build/wipeout.app "$staging"
          mv "$staging" build/Wipeout.app
          ditto -c -k --sequesterRsrc --keepParent build/Wipeout.app Wipeout.app.zip
          mv build/Wipeout.app "$staging"
          mv "$staging" build/wipeout.app

      - name: Create update metadata
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^VERSION="/ { print $2; exit }' build.sh)
          test -n "$VERSION"
          printf '%s' "$VERSION" > version.txt
          HASH=$(shasum -a 256 wipeout.app.zip | awk '{ print tolower($1) }')
          printf '%s  wipeout.app.zip' "$HASH" > wipeout.app.zip.sha256
          LEGACY_HASH=$(shasum -a 256 Wipeout.app.zip | awk '{ print tolower($1) }')
          printf '%s  Wipeout.app.zip' "$LEGACY_HASH" > Wipeout.app.zip.sha256

      - name: Verify update zip contract
        run: |
          python3 - <<'PY'
          import hashlib, plistlib, zipfile
          from pathlib import Path

          def check(zip_path, top, executable):
              zf = zipfile.ZipFile(zip_path)
              names = zf.namelist()
              tops = {n.split("/")[0] for n in names}
              assert tops == {top}, f"{zip_path}: top-level {tops}, expected {{{top}}}"
              exe = f"{top}/Contents/MacOS/{executable}"
              plist_name = f"{top}/Contents/Info.plist"
              assert exe in names, f"{zip_path}: missing {exe}"
              assert plist_name in names, f"{zip_path}: missing Info.plist"
              plist = plistlib.loads(zf.read(plist_name))
              assert plist.get("CFBundleExecutable") == executable, plist.get("CFBundleExecutable")
              assert plist.get("CFBundleShortVersionString") == Path("version.txt").read_text()
              print(f"ok {zip_path}: top={top} exe={executable} entries={len(names)}")

          check("wipeout.app.zip", "wipeout.app", "wipeout")
          check("Wipeout.app.zip", "Wipeout.app", "wipeout")

          for name in ("wipeout.app.zip", "Wipeout.app.zip"):
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              sidecar = Path(name + ".sha256").read_text().strip().split()
              assert sidecar[0].lower() == actual, (name, sidecar[0], actual)
              if len(sidecar) > 1:
                  assert sidecar[-1] == name, sidecar
              print(f"ok {name}.sha256 matches")

          # The two zips differ because the top-level bundle names differ.
          h1 = hashlib.sha256(Path("wipeout.app.zip").read_bytes()).hexdigest()
          h2 = hashlib.sha256(Path("Wipeout.app.zip").read_bytes()).hexdigest()
          assert h1 != h2, "expected the legacy zip to hash differently"
          print("ok zip hashes differ")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wipeout-macOS-arm64
          path: |
            wipeout.app.zip
            wipeout.app.zip.sha256
            Wipeout.app.zip
            Wipeout.app.zip.sha256
            version.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wipeout-macOS-arm64

      - name: Publish latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: Apple Silicon build of wipeout. This file is replaced on every push to main. The lowercase wipeout.app.zip is the current download; Wipeout.app.zip is kept so older in-app updaters still work.
          files: |
            wipeout.app.zip
            wipeout.app.zip.sha256
            Wipeout.app.zip
            Wipeout.app.zip.sha256
            version.txt
          make_latest: true
